[project]
name = "lab"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.28.43",
    "click>=8.1.7",
    "loguru>=0.7.2",
    "numpy>=1.21.6",
    "tqdm>=4.67.1",
    "requests",
    "httpx",
    "pillow>=11.0.0",
    "reportlab",
    "modelscope>=1.26.0",
    "huggingface-hub>=0.32.4",
    "json-repair>=0.46.2",
    "opencv-python>=4.11.0.86",
    "python-dotenv>=1.1.1",
    "matplotlib>=3.10,<4",
    "omegaconf>=2.3.0,<3",
    "transformers>=4.49.0,!=4.51.0,<5.0.0",
    "accelerate>=1.5.1",
    "PyYAML>=6.0.2,<7",
    "torch>=2.6.0,<3",
    "torchvision",
    "datasets>=4.3.0",
    "lightning>=2.5.6",
    "wandb>=0.22.3",
    "weave>=0.52.15",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
